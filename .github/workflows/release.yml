name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build:exe
      - name: Smoke test
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $reported = (& .\dist\vigie.exe --version).Trim()
          if ($reported -ne $version) { throw "vigie.exe reports $reported, expected $version" }
          & .\dist\vigie.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "vigie.exe --help failed" }
          (Get-Item .\dist\vigie.exe).VersionInfo | Format-List CompanyName, ProductName, FileVersion
      - uses: actions/upload-artifact@v4
        with:
          name: vigie-windows
          path: dist/vigie.exe
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/vigie.exe --clobber
          else
            gh release create "$tag" dist/vigie.exe --title "vigie $tag" --generate-notes
          fi
